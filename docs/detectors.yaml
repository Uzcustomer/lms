    group: "DAVOMAT"
    rule: "Semestrda sababsiz 30–74 soat — intizomiy chora"
    legal_basis: "Faqat Filial ichki tartib-qoidalarida belgilangan bo'lsa (VMQ 578 3-il. 49(v) umumiy havola)"
    detection: "HEMIS davomat ↔ intizomiy buyruqlar"
    status: "⚠"
    pilot: false
    enabled: true                    # buyurtmachi (16.10.2026): «xavf zonasi» panelda ko'rinsin
    warning_mode: true
    default_owner_role: "dekan"
    params:
      min_hours: 30                  # xavf zonasi: sababsiz soat shu chegaradan (D-2 bilan bir xil hisob)
      max_hours: 74                  # shu chegaragacha; oshsa — D-2
      exclude_medical: true
      medical_reasons: [kasallik, tibbiy_korik]
      excluded_training_types: []
