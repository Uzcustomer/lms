# 8G heap + 4G metaspace asked for more than this machine (7.7 GB total)
# can give, so the daemon was killed on startup. These fit in RAM and are
# enough for this module; raise them on a bigger machine if builds slow.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
