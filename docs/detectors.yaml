# TTATF Registrator ofisi — nazorat detektorlari katalogi
# Manba: TTATF_Monitoring_va_avtomatlashtirish_rejasi.md, 7-bo'lim (15.10.2026 tekshirilgan tahrir)
# status: ✅ tasdiqlangan · ✏️ tuzatilgan · 🆕 yangi · ⚠ normasi tekshirilishi kerak (faqat ogohlantirish rejimi)
# Har bir detektor: trigger to'plami ↔ kutilgan harakat to'plami; farq = istisno (exception).
# Muddat va chegaralar kodga qotirilmaydi — shu fayldan (keyin DB dan) o'qiladi.
# Ixtiyoriy kalitlar (mark monitoring moduli o'qiydi):
#   params             — chegara va muddatlar; birinchi seed'dan keyin paneldan tahrirlanadi
#   default_owner_role — istisno kimga avtomatik biriktiriladi (dekan, kafedra_mudiri, registrator_ofisi ...)
#   due_workdays       — mas'ulning javob muddati, ish kunida (standart 3)
#   warning_mode       — true: faqat ogohlantirish (mas'ulga yuborilmaydi); paneldan o'chiriladi
# Jami: 54 ta detektor

detectors:
